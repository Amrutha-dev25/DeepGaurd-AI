[project]
name = "deepguard-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "DeepGuard AI Team", email = "deepguard@example.com"},
]



dependencies = [
    # ── ADK framework + LLM routing ──────────────────────────────────
    "google-adk[gcp]>=2.0.0,<3.0.0",

    # ── Web framework ────────────────────────────────────────────────
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "slowapi>=0.1.9",

    # ── Settings & config ────────────────────────────────────────────
    "pydantic-settings>=2.0.0,<3.0.0",

    # ── HTTP clients ────────────────────────────────────────────────
    "aiohttp>=3.9.0,<4.0.0",          # Sightengine provider
    "httpx>=0.27.0",                  # ADK LiteLlm transport

    # ── Image / computer vision ─────────────────────────────────────
    "opencv-python-headless>=4.10.0", # cv2 (smaller, no GUI deps)
    "pillow>=10.4.0",                 # PIL Image
    "numpy>=1.26.0,<2.0.0",           # np — used in wavelet, FFT, DCT

    # ── Forensics ───────────────────────────────────────────────────
    "exifread>=3.0.0",
    "imagehash>=4.3.0",
    "python-magic>=0.4.27",           # MIME detection (Linux/macOS)
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",

    # ── PDF generation ──────────────────────────────────────────────
    "fpdf2>=2.8.7",

    # ── Observability (ADK GCP integration) ─────────────────────────
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",

    # ── Legacy aliases for uv/Docker compat ─────────────────────────
    "python-dotenv>=1.0.1",           # pulled by pydantic-settings, explicit for safety
]

requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006", "B008"] # ignore line too long, too complex, function calls in defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,**/package-lock.json"




[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]


